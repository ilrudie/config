# set true color
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# start windows & panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# open new panes in cwd
bind '^' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# set improved prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
setw -g mode-keys vi

# <prefix>+u opens a tmp popup (-E forwards Esc to the program; exit shell to close)
bind u display-popup -E -d "#{pane_current_path}"

# enable plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_window_text "#W"

set -g @catppuccin_status_modules_right "directory host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# shift+enter support
# set -g extended-keys on
# set -s extended-keys always 
# set -as terminal-features "alacritty:extkeys"

# save/restore sessions automatically
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# TPM from its standard XDG location (portable across macOS + Linux).
# One-time install: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
run '~/.config/tmux/plugins/tpm/tpm'
